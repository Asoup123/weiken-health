<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>威肯管理後台</title>

<style>
*{box-sizing:border-box}
body{
    margin:0;
    font-family:"Microsoft JhengHei",Arial,sans-serif;
    background:#f5f5f3;
    color:#222;
}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
.app{
    min-height:100vh;
    display:grid;
    grid-template-columns:230px 1fr;
}
aside{
    background:#20211f;
    color:white;
    padding:30px 22px;
    display:flex;
    flex-direction:column;
}
.logo{
    font-size:12px;
    letter-spacing:4px;
    color:#aaa;
}
aside h1{
    font-size:20px;
    margin:8px 0 34px;
}
.nav-list{
    display:flex;
    flex-direction:column;
    gap:8px;
}
.nav{
    width:100%;
    border:0;
    text-align:left;
    padding:13px 14px;
    border-radius:9px;
    background:transparent;
    color:#ddd;
    font-weight:700;
}
.nav:hover{background:#2d2e2b}
.nav.active{
    background:white;
    color:#222;
}
.logout{
    margin-top:auto;
    padding:12px;
    border:1px solid #555;
    border-radius:9px;
    background:none;
    color:#ddd;
}
main{
    padding:42px;
    max-width:1300px;
    width:100%;
    margin:auto;
}
.page{display:none}
.page.active{display:block}
.top{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:28px;
    gap:20px;
}
h2{
    margin:0 0 7px;
    font-size:28px;
}
.top p{
    margin:0;
    color:#888;
}
.add,.save{
    border:0;
    border-radius:9px;
    background:#222;
    color:white;
    padding:13px 20px;
    font-weight:700;
}
.add:hover,.save:hover{background:#000}
button:disabled{
    opacity:.55;
    cursor:not-allowed;
}
.notice{
    display:none;
    margin-bottom:16px;
    padding:12px 14px;
    border-radius:8px;
}
.notice.show{display:block}
.notice.ok{
    background:#edf8ef;
    color:#16733c;
}
.notice.err{
    background:#fff1f1;
    color:#b42318;
}
.card{
    background:white;
    border:1px solid #e5e5e1;
    border-radius:14px;
    overflow:hidden;
}
.row{
    display:grid;
    grid-template-columns:90px 90px 1fr 170px;
    gap:18px;
    align-items:center;
    padding:15px 20px;
    border-bottom:1px solid #eee;
}
.row:last-child{border-bottom:0}
.product-row{
    grid-template-columns:90px 80px 1.25fr 1fr 170px;
}
.head{
    background:#fafafa;
    color:#888;
    font-size:13px;
    font-weight:700;
}
.thumb{
    width:64px;
    height:64px;
    border-radius:50%;
    object-fit:cover;
    background:#eee;
}
.product-thumb{border-radius:9px}
.noimg{
    display:grid;
    place-items:center;
    font-size:11px;
    color:#aaa;
}
.actions{
    display:flex;
    gap:8px;
}
.actions button{
    padding:8px 11px;
    border:1px solid #ddd;
    background:white;
    border-radius:7px;
}
.actions button:hover{background:#f5f5f5}
.danger{color:#b42318}
.sort-cell{
    display:flex;
    align-items:center;
    gap:10px;
    font-variant-numeric:tabular-nums;
}
.drag-handle{
    border:0;
    background:transparent;
    padding:8px 4px;
    color:#999;
    font-size:20px;
    line-height:1;
    cursor:grab;
    touch-action:none;
    user-select:none;
}
.drag-handle:active{cursor:grabbing}
.drag-ghost{opacity:.35;background:#f2f2ef}
.drag-chosen{box-shadow:0 8px 24px #00000014}
.dragging-body{user-select:none}
.state{
    padding:45px;
    text-align:center;
    color:#888;
}
.bad{color:#b42318}
.modal{
    position:fixed;
    inset:0;
    background:#0006;
    display:none;
    align-items:center;
    justify-content:center;
    padding:20px;
    z-index:999;
}
.modal.open{display:flex}
.panel{
    width:min(500px,100%);
    background:white;
    border-radius:16px;
    padding:28px;
    max-height:90vh;
    overflow:auto;
}
.panel h3{margin-top:0}
.field{margin:18px 0}
.field label{
    display:block;
    font-weight:700;
    font-size:14px;
    margin-bottom:8px;
}
.field input,.field select,.field textarea{
    width:100%;
    padding:12px;
    border:1px solid #ddd;
    border-radius:8px;
    background:white;
}
.preview{
    display:none;
    width:90px;
    height:90px;
    object-fit:cover;
    border-radius:50%;
    margin-top:12px;
}
.field textarea{min-height:180px;resize:vertical;line-height:1.7}

/* 商品多圖片管理 */
.product-image-help{
    margin-top:8px;
    color:#888;
    font-size:12px;
    line-height:1.6;
}
.product-image-grid{
    display:grid;
    grid-template-columns:repeat(4,minmax(0,1fr));
    gap:12px;
    margin-top:14px;
}
.product-image-item{
    position:relative;
    aspect-ratio:1/1;
    overflow:hidden;
    border:1px solid #e4e4df;
    border-radius:10px;
    background:#fafafa;
    cursor:grab;
    user-select:none;
}
.product-image-item:active{cursor:grabbing}
.product-image-item img{
    width:100%;
    height:100%;
    display:block;
    object-fit:contain;
    background:#fff;
}
.product-image-remove{
    position:absolute;
    top:6px;
    right:6px;
    width:28px;
    height:28px;
    padding:0;
    display:grid;
    place-items:center;
    border:0;
    border-radius:50%;
    background:rgba(25,25,25,.78);
    color:#fff;
    font-size:18px;
    line-height:1;
    cursor:pointer;
}
.product-image-remove:hover{background:#b42318}
.product-image-badge{
    position:absolute;
    left:7px;
    bottom:7px;
    padding:4px 7px;
    border-radius:999px;
    background:rgba(255,255,255,.92);
    color:#333;
    font-size:11px;
    box-shadow:0 2px 8px #00000012;
}
.product-image-ghost{opacity:.3}
.product-image-chosen{box-shadow:0 8px 24px #0002}
.modal-actions{
    display:flex;
    justify-content:flex-end;
    gap:10px;
    margin-top:25px;
}
.cancel{
    padding:11px 16px;
    border:1px solid #ddd;
    background:white;
    border-radius:8px;
}
@media(max-width:760px){
    .app{display:block}
    aside{padding:18px}
    aside h1{margin-bottom:15px}
    .nav-list{flex-direction:row}
    .nav{text-align:center}
    .logout{margin-top:15px;width:100%}
    main{padding:24px 15px}
    .top{align-items:flex-start;flex-direction:column}
    .row,.product-row{grid-template-columns:70px 65px 1fr}
    .row .actions,.product-row .actions{grid-column:2/4}
    .product-row .category-cell{grid-column:2/4}
    .head{display:none}
    .product-image-grid{grid-template-columns:repeat(3,minmax(0,1fr))}
}
@media(max-width:480px){
    .product-image-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
}
</style>
</head>

<body>
<div class="app">
<aside>
    <div class="logo">WEIKEN</div>
    <h1>威肯管理後台</h1>

    <div class="nav-list">
        <button class="nav active" data-page="categoriesPage">商品分類</button>
        <button class="nav" data-page="productsPage">商品管理</button>
    </div>

    <button id="logout" class="logout">登出</button>
</aside>

<main>
    <section id="categoriesPage" class="page active">
        <div class="top">
            <div>
                <h2>商品分類管理</h2>
                <p>新增、修改、刪除官網的商品分類。</p>
            </div>
            <button id="addCategory" class="add">＋ 新增分類</button>
        </div>

        <div id="categoryNotice" class="notice"></div>

        <div class="card">
            <div class="row head">
                <div>圖片</div>
                <div>順序</div>
                <div>分類名稱</div>
                <div>操作</div>
            </div>
            <div id="categoryList">
                <div class="state">正在讀取分類...</div>
            </div>
        </div>
    </section>

    <section id="productsPage" class="page">
        <div class="top">
            <div>
                <h2>商品管理</h2>
                <p>新增商品、選擇分類、上傳商品主圖與調整排序。</p>
            </div>
            <button id="addProduct" class="add">＋ 新增商品</button>
        </div>

        <div id="productNotice" class="notice"></div>

        <div class="card">
            <div class="row product-row head">
                <div>圖片</div>
                <div>順序</div>
                <div>商品名稱</div>
                <div>所屬分類</div>
                <div>操作</div>
            </div>
            <div id="productList">
                <div class="state">正在讀取商品...</div>
            </div>
        </div>
    </section>
</main>
</div>

<!-- 分類視窗 -->
<div id="categoryModal" class="modal">
<div class="panel">
    <h3 id="categoryTitle">新增分類</h3>
    <form id="categoryForm">
        <div class="field">
            <label>分類名稱</label>
            <input id="categoryName" required placeholder="例如：輪椅">
        </div>
        <div class="field">
            <label>排序</label>
            <input id="categorySort" required type="number" min="0" value="1">
        </div>
        <div class="field">
            <label>分類圖片</label>
            <input id="categoryImage" type="file" accept="image/*">
            <img id="categoryPreview" class="preview" alt="">
        </div>
        <div class="modal-actions">
            <button id="categoryCancel" type="button" class="cancel">取消</button>
            <button id="categorySave" class="save">儲存分類</button>
        </div>
    </form>
</div>
</div>

<!-- 商品視窗 -->
<div id="productModal" class="modal">
<div class="panel">
    <h3 id="productTitle">新增商品</h3>
    <form id="productForm">
        <div class="field">
            <label>商品名稱</label>
            <input id="productName" required placeholder="例如：鋁合金輪椅">
        </div>
        <div class="field">
            <label>所屬分類</label>
            <select id="productCategory" required>
                <option value="">正在讀取分類...</option>
            </select>
        </div>
        <div class="field">
            <label>排序</label>
            <input id="productSort" required type="number" min="0" value="1">
        </div>
        <div class="field">
            <label>商品資訊</label>
            <textarea id="productInfo" placeholder="請輸入商品介紹、特色、尺寸、規格等資訊"></textarea>
        </div>
        <div class="field">
            <label>商品圖片</label>
            <input id="productImage" type="file" accept="image/*" multiple>
            <div class="product-image-help">可一次選擇多張圖片。拖曳圖片即可調整順序，第 1 張會作為商品主圖；右上角 × 可移除圖片。</div>
            <div id="productImageGrid" class="product-image-grid"></div>
        </div>
        <div class="modal-actions">
            <button id="productCancel" type="button" class="cancel">取消</button>
            <button id="productSave" class="save">儲存商品</button>
        </div>
    </form>
</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/appwrite@17.0.0"></script>
<script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.6/Sortable.min.js"></script>
<script>
const ENDPOINT="https://sgp.cloud.appwrite.io/v1";
const PROJECT_ID="6aab96e3000fa724b62d";
const DATABASE_ID="6aab978f00363c84475b";
const CATEGORY_TABLE_ID="categories";
const PRODUCT_TABLE_ID="products";
const BUCKET_ID="weiken-images";
const ADMIN_TEAM_ID="6aaba9fa001fa283e8a7";

const client=new Appwrite.Client().setEndpoint(ENDPOINT).setProject(PROJECT_ID);
const account=new Appwrite.Account(client);
const db=new Appwrite.Databases(client);
const storage=new Appwrite.Storage(client);

let categories=[];
let products=[];
let editingCategory=null;
let editingProduct=null;
let productImageItems=[];
let removedProductImageIds=new Set();
let productImageSortable=null;
let categorySortable=null;
let productSortable=null;

const $=s=>document.querySelector(s);

function esc(v){
    return String(v ?? "").replace(/[&<>"']/g,x=>({
        "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
    }[x]));
}

function fileUrl(id){
    if(!id) return "";
    return `${ENDPOINT}/storage/buckets/${BUCKET_ID}/files/${id}/view?project=${PROJECT_ID}`;
}

function say(el,text,type="ok"){
    el.textContent=text;
    el.className="notice show "+type;
    setTimeout(()=>el.className="notice",3500);
}

async function guard(){
    try{ await account.get(); }
    catch(e){ location.replace("index.html"); }
}

async function uploadImage(file){
    if(!file) return "";
    const upload=await storage.createFile(
        BUCKET_ID,
        Appwrite.ID.unique(),
        file,
        [
            Appwrite.Permission.read(Appwrite.Role.any()),
            Appwrite.Permission.update(Appwrite.Role.team(ADMIN_TEAM_ID)),
            Appwrite.Permission.delete(Appwrite.Role.team(ADMIN_TEAM_ID))
        ]
    );
    return upload.$id;
}

async function deleteImage(id){
    if(!id) return;
    try{ await storage.deleteFile(BUCKET_ID,id); }
    catch(e){ console.warn("圖片刪除失敗",e); }
}

function nextSort(items){
    if(!items.length) return 1;
    return Math.max(...items.map(x=>Number(x.sort_order)||0))+1;
}

async function resequence(tableId, orderedIds){
    await Promise.all(
        orderedIds.map((id,index)=>
            db.updateDocument(
                DATABASE_ID,
                tableId,
                id,
                {sort_order:index+1}
            )
        )
    );
}

/* 把指定項目插入第 desired 位，其他項目自動順延 */
async function placeAt(tableId, itemId, desired){
    const result=await db.listDocuments(
        DATABASE_ID,
        tableId,
        [Appwrite.Query.orderAsc("sort_order"),Appwrite.Query.limit(100)]
    );

    const others=result.documents.filter(x=>x.$id!==itemId);
    const position=Math.max(1,Math.min(Number(desired)||1,others.length+1));
    const ids=others.map(x=>x.$id);
    ids.splice(position-1,0,itemId);
    await resequence(tableId,ids);
}

async function normalizeTable(tableId){
    const result=await db.listDocuments(
        DATABASE_ID,
        tableId,
        [Appwrite.Query.orderAsc("sort_order"),Appwrite.Query.limit(100)]
    );
    await resequence(tableId,result.documents.map(x=>x.$id));
}

function makeSortable(el,tableId,type){
    if(!el || !window.Sortable) return null;

    return new Sortable(el,{
        animation:170,
        handle:".drag-handle",
        draggable:".sortable-row",
        ghostClass:"drag-ghost",
        chosenClass:"drag-chosen",

        /* 靠近瀏覽器上下邊界時，自動捲動畫面 */
        scroll:true,
        bubbleScroll:true,
        scrollSensitivity:100,
        scrollSpeed:18,

        onStart(){
            document.body.classList.add("dragging-body");
        },

        async onEnd(){
            document.body.classList.remove("dragging-body");

            const ids=[...el.querySelectorAll(".sortable-row")]
                .map(row=>row.dataset.id);

            if(!ids.length) return;

            const noticeEl=type==="category"
                ? $("#categoryNotice")
                : $("#productNotice");

            try{
                say(noticeEl,"正在儲存新順序...");
                await resequence(tableId,ids);

                if(type==="category"){
                    await loadCategories();
                    say(noticeEl,"分類順序已更新");
                }else{
                    await loadProducts();
                    say(noticeEl,"商品順序已更新");
                }
            }catch(e){
                console.error(e);
                say(noticeEl,"排序儲存失敗："+e.message,"err");
                if(type==="category") await loadCategories();
                else await loadProducts();
            }
        }
    });
}

/* 頁面切換 */
document.querySelectorAll(".nav").forEach(btn=>{
    btn.onclick=async()=>{
        document.querySelectorAll(".nav").forEach(x=>x.classList.remove("active"));
        document.querySelectorAll(".page").forEach(x=>x.classList.remove("active"));
        btn.classList.add("active");
        $("#"+btn.dataset.page).classList.add("active");

        if(btn.dataset.page==="productsPage"){
            await loadCategories();
            await loadProducts();
        }
    };
});

/* ================= 分類 ================= */
async function loadCategories(){
    const categoryList=$("#categoryList");
    if(categoryList) categoryList.innerHTML='<div class="state">正在讀取分類...</div>';

    try{
        const result=await db.listDocuments(
            DATABASE_ID,
            CATEGORY_TABLE_ID,
            [Appwrite.Query.orderAsc("sort_order"),Appwrite.Query.limit(100)]
        );
        categories=result.documents;

        if(categoryList){
            if(!categories.length){
                categoryList.innerHTML='<div class="state">目前沒有分類，請按「新增分類」。</div>';
            }else{
                categoryList.innerHTML=categories.map(d=>`
                    <div class="row sortable-row" data-id="${d.$id}">
                        <div>${d.image_id
                            ? `<img class="thumb" src="${fileUrl(d.image_id)}" alt="${esc(d.name)}">`
                            : '<div class="thumb noimg">無圖片</div>'}</div>
                        <div class="sort-cell"><span class="drag-handle" title="拖曳排序">☰</span><span>${esc(d.sort_order)}</span></div>
                        <div><strong>${esc(d.name)}</strong></div>
                        <div class="actions">
                            <button onclick="editCategory('${d.$id}')">修改</button>
                            <button class="danger" onclick="removeCategory('${d.$id}')">刪除</button>
                        </div>
                    </div>
                `).join("");
            }
        }
        fillCategorySelect();

        if(categorySortable) categorySortable.destroy();
        categorySortable=categories.length
            ? makeSortable(categoryList,CATEGORY_TABLE_ID,"category")
            : null;
    }catch(e){
        console.error(e);
        if(categoryList) categoryList.innerHTML=`<div class="state bad">讀取失敗：${esc(e.message)}</div>`;
        throw e;
    }
}

function fillCategorySelect(selected=""){
    const select=$("#productCategory");
    if(!categories.length){
        select.innerHTML='<option value="">目前沒有商品分類</option>';
        return;
    }
    select.innerHTML='<option value="">請選擇分類</option>'+
        categories.map(c=>`<option value="${esc(c.$id)}" ${c.$id===selected?"selected":""}>${esc(c.name)}</option>`).join("");
}

function openCategoryModal(d=null){
    editingCategory=d;
    $("#categoryTitle").textContent=d?"修改分類":"新增分類";
    $("#categoryName").value=d?.name || "";
    $("#categorySort").value=d?.sort_order ?? nextSort(categories);
    $("#categoryImage").value="";
    if(d?.image_id){
        $("#categoryPreview").src=fileUrl(d.image_id);
        $("#categoryPreview").style.display="block";
    }else{
        $("#categoryPreview").removeAttribute("src");
        $("#categoryPreview").style.display="none";
    }
    $("#categoryModal").classList.add("open");
}

function closeCategoryModal(){
    $("#categoryModal").classList.remove("open");
    editingCategory=null;
    $("#categoryForm").reset();
    $("#categorySort").value=nextSort(categories);
    $("#categoryPreview").removeAttribute("src");
    $("#categoryPreview").style.display="none";
}

window.editCategory=async id=>{
    try{
        const d=await db.getDocument(DATABASE_ID,CATEGORY_TABLE_ID,id);
        openCategoryModal(d);
    }catch(e){ say($("#categoryNotice"),"讀取分類失敗："+e.message,"err"); }
};

window.removeCategory=async id=>{
    if(!confirm("確定要刪除這個分類嗎？")) return;
    try{
        const d=await db.getDocument(DATABASE_ID,CATEGORY_TABLE_ID,id);
        await db.deleteDocument(DATABASE_ID,CATEGORY_TABLE_ID,id);
        await deleteImage(d.image_id);
        await normalizeTable(CATEGORY_TABLE_ID);
        say($("#categoryNotice"),"分類已刪除");
        await loadCategories();
    }catch(e){ say($("#categoryNotice"),"刪除失敗："+e.message,"err"); }
};

$("#categoryImage").onchange=()=>{
    const file=$("#categoryImage").files[0];
    if(!file) return;
    $("#categoryPreview").src=URL.createObjectURL(file);
    $("#categoryPreview").style.display="block";
};

$("#categoryForm").onsubmit=async e=>{
    e.preventDefault();
    const name=$("#categoryName").value.trim();
    const sort=Number($("#categorySort").value);
    if(!name) return say($("#categoryNotice"),"請輸入分類名稱","err");

    const btn=$("#categorySave");
    btn.disabled=true;
    btn.textContent="儲存中...";
    let uploaded="";

    try{
        let imageId=editingCategory?.image_id || "";
        const file=$("#categoryImage").files[0];
        if(file){
            uploaded=await uploadImage(file);
            imageId=uploaded;
        }
        const data={name,sort_order:sort,image_id:imageId};
        let savedId="";

        if(editingCategory){
            const old=editingCategory.image_id;
            savedId=editingCategory.$id;
            await db.updateDocument(DATABASE_ID,CATEGORY_TABLE_ID,savedId,data);
            await placeAt(CATEGORY_TABLE_ID,savedId,sort);
            if(file && old && old!==imageId) await deleteImage(old);
            say($("#categoryNotice"),"分類已更新");
        }else{
            const created=await db.createDocument(
                DATABASE_ID,CATEGORY_TABLE_ID,Appwrite.ID.unique(),data,
                [
                    Appwrite.Permission.read(Appwrite.Role.any()),
                    Appwrite.Permission.update(Appwrite.Role.team(ADMIN_TEAM_ID)),
                    Appwrite.Permission.delete(Appwrite.Role.team(ADMIN_TEAM_ID))
                ]
            );
            savedId=created.$id;
            await placeAt(CATEGORY_TABLE_ID,savedId,sort);
            say($("#categoryNotice"),"分類已新增");
        }
        closeCategoryModal();
        await loadCategories();
    }catch(e){
        console.error(e);
        if(uploaded) await deleteImage(uploaded);
        say($("#categoryNotice"),"儲存失敗："+e.message,"err");
    }finally{
        btn.disabled=false;
        btn.textContent="儲存分類";
    }
};

/* ================= 商品 ================= */
async function loadProducts(){
    const list=$("#productList");
    list.innerHTML='<div class="state">正在讀取商品...</div>';

    try{
        const result=await db.listDocuments(
            DATABASE_ID,
            PRODUCT_TABLE_ID,
            [Appwrite.Query.orderAsc("sort_order"),Appwrite.Query.limit(100)]
        );
        products=result.documents;

        if(!products.length){
            list.innerHTML='<div class="state">目前沒有商品，請按「新增商品」。</div>';
            return;
        }

        const categoryMap=Object.fromEntries(categories.map(c=>[c.$id,c.name]));

        list.innerHTML=products.map(d=>`
            <div class="row product-row sortable-row" data-id="${d.$id}">
                <div>${d.image_id
                    ? `<img class="thumb product-thumb" src="${fileUrl(d.image_id)}" alt="${esc(d.name)}">`
                    : '<div class="thumb product-thumb noimg">無圖片</div>'}</div>
                <div class="sort-cell"><span class="drag-handle" title="拖曳排序">☰</span><span>${esc(d.sort_order)}</span></div>
                <div><strong>${esc(d.name)}</strong></div>
                <div class="category-cell">${esc(categoryMap[d.category_id] || "分類已不存在")}</div>
                <div class="actions">
                    <button onclick="editProduct('${d.$id}')">修改</button>
                    <button class="danger" onclick="removeProduct('${d.$id}')">刪除</button>
                </div>
            </div>
        `).join("");

        if(productSortable) productSortable.destroy();
        productSortable=makeSortable(list,PRODUCT_TABLE_ID,"product");
    }catch(e){
        console.error(e);
        list.innerHTML=`<div class="state bad">讀取失敗：${esc(e.message)}</div>`;
    }
}

function getStoredProductImageIds(product){
    if(!product) return [];

    let ids=[];
    if(Array.isArray(product.image_ids)){
        ids=product.image_ids.filter(Boolean);
    }else if(typeof product.image_ids==="string" && product.image_ids.trim()){
        try{
            const parsed=JSON.parse(product.image_ids);
            if(Array.isArray(parsed)) ids=parsed.filter(Boolean);
        }catch(e){
            ids=product.image_ids.split(",").map(v=>v.trim()).filter(Boolean);
        }
    }

    if(product.image_id && !ids.includes(product.image_id)){
        ids.unshift(product.image_id);
    }

    return [...new Set(ids)];
}

function revokeNewImageUrls(){
    productImageItems.forEach(item=>{
        if(item.isNew && item.url) URL.revokeObjectURL(item.url);
    });
}

function renderProductImageGrid(){
    const grid=$("#productImageGrid");

    grid.innerHTML=productImageItems.map((item,index)=>`
        <div class="product-image-item" data-key="${esc(item.key)}">
            <img src="${esc(item.url)}" alt="商品圖片 ${index+1}">
            <button
                type="button"
                class="product-image-remove"
                data-key="${esc(item.key)}"
                aria-label="移除這張圖片"
                title="移除圖片"
            >×</button>
            ${index===0 ? '<span class="product-image-badge">主圖</span>' : ''}
        </div>
    `).join("");

    if(productImageSortable) productImageSortable.destroy();

    productImageSortable=new Sortable(grid,{
        animation:160,
        draggable:".product-image-item",
        ghostClass:"product-image-ghost",
        chosenClass:"product-image-chosen",
        onEnd(){
            const order=[...grid.querySelectorAll(".product-image-item")]
                .map(el=>el.dataset.key);

            productImageItems=order
                .map(key=>productImageItems.find(item=>item.key===key))
                .filter(Boolean);

            renderProductImageGrid();
        }
    });
}

function addSelectedProductImages(files){
    [...files].forEach(file=>{
        if(!file.type.startsWith("image/")) return;

        productImageItems.push({
            key:"new-"+crypto.randomUUID(),
            id:"",
            file,
            url:URL.createObjectURL(file),
            isNew:true
        });
    });

    renderProductImageGrid();
}

async function openProductModal(d=null){
    editingProduct=d;
    removedProductImageIds=new Set();
    revokeNewImageUrls();
    productImageItems=[];

    $("#productTitle").textContent=d?"修改商品":"新增商品";
    $("#productName").value=d?.name || "";
    $("#productSort").value=d?.sort_order ?? nextSort(products);

    const oldInfoParts=[];
    if(d?.features) oldInfoParts.push(d.features);
    if(d?.specifications) oldInfoParts.push(d.specifications);

    $("#productInfo").value=
        d?.product_info ||
        oldInfoParts.join("\n\n");

    $("#productImage").value="";
    fillCategorySelect(d?.category_id || "");

    getStoredProductImageIds(d).forEach(id=>{
        productImageItems.push({
            key:"old-"+id,
            id,
            file:null,
            url:fileUrl(id),
            isNew:false
        });
    });

    renderProductImageGrid();
    $("#productModal").classList.add("open");
}

function closeProductModal(){
    $("#productModal").classList.remove("open");
    editingProduct=null;
    $("#productForm").reset();
    $("#productSort").value=nextSort(products);

    revokeNewImageUrls();
    productImageItems=[];
    removedProductImageIds=new Set();

    if(productImageSortable){
        productImageSortable.destroy();
        productImageSortable=null;
    }

    $("#productImageGrid").innerHTML="";
}

window.editProduct=async id=>{
    try{
        await loadCategories();
        const d=await db.getDocument(DATABASE_ID,PRODUCT_TABLE_ID,id);
        openProductModal(d);
    }catch(e){ say($("#productNotice"),"讀取商品失敗："+e.message,"err"); }
};

window.removeProduct=async id=>{
    if(!confirm("確定要刪除這個商品嗎？")) return;

    try{
        const d=await db.getDocument(DATABASE_ID,PRODUCT_TABLE_ID,id);
        const imageIds=getStoredProductImageIds(d);

        await db.deleteDocument(DATABASE_ID,PRODUCT_TABLE_ID,id);

        for(const imageId of imageIds){
            await deleteImage(imageId);
        }

        await normalizeTable(PRODUCT_TABLE_ID);
        say($("#productNotice"),"商品已刪除");
        await loadProducts();
    }catch(e){ say($("#productNotice"),"刪除失敗："+e.message,"err"); }
};

$("#productImage").onchange=()=>{
    const input=$("#productImage");
    if(!input.files?.length) return;

    addSelectedProductImages(input.files);

    /* 允許下一次再次選擇同一個檔案 */
    input.value="";
};

$("#productImageGrid").addEventListener("click",e=>{
    const button=e.target.closest(".product-image-remove");
    if(!button) return;

    const key=button.dataset.key;
    const item=productImageItems.find(image=>image.key===key);
    if(!item) return;

    if(item.isNew && item.url){
        URL.revokeObjectURL(item.url);
    }

    if(!item.isNew && item.id){
        removedProductImageIds.add(item.id);
    }

    productImageItems=productImageItems.filter(image=>image.key!==key);
    renderProductImageGrid();
});

$("#productForm").onsubmit=async e=>{
    e.preventDefault();

    const name=$("#productName").value.trim();
    const categoryId=$("#productCategory").value;
    const sort=Number($("#productSort").value);
    const productInfo=$("#productInfo").value.trim();

    if(!name) return say($("#productNotice"),"請輸入商品名稱","err");
    if(!categoryId) return say($("#productNotice"),"請選擇商品分類","err");

    const btn=$("#productSave");
    btn.disabled=true;
    btn.textContent="儲存中...";

    const uploadedThisSave=[];

    try{
        const finalImageIds=[];

        /* 依照目前拖曳後的順序逐張處理 */
        for(const item of productImageItems){
            if(item.isNew){
                const newId=await uploadImage(item.file);
                uploadedThisSave.push(newId);
                finalImageIds.push(newId);
            }else if(item.id){
                finalImageIds.push(item.id);
            }
        }

        const imageId=finalImageIds[0] || "";

        const data={
            name:name,
            category_id:categoryId,
            image_id:imageId,
            image_ids:finalImageIds,
            sort_order:sort,
            product_info:productInfo
        };

        if(editingProduct){
            await db.updateDocument(
                DATABASE_ID,
                PRODUCT_TABLE_ID,
                editingProduct.$id,
                data
            );

            await placeAt(PRODUCT_TABLE_ID,editingProduct.$id,sort);

            /* 資料儲存成功後，才真的刪除使用者按 × 移除的舊圖片 */
            for(const removedId of removedProductImageIds){
                if(!finalImageIds.includes(removedId)){
                    await deleteImage(removedId);
                }
            }

            say($("#productNotice"),"商品已更新");
        }else{
            const created=await db.createDocument(
                DATABASE_ID,
                PRODUCT_TABLE_ID,
                Appwrite.ID.unique(),
                data,
                [
                    Appwrite.Permission.read(Appwrite.Role.any()),
                    Appwrite.Permission.update(Appwrite.Role.team(ADMIN_TEAM_ID)),
                    Appwrite.Permission.delete(Appwrite.Role.team(ADMIN_TEAM_ID))
                ]
            );

            await placeAt(PRODUCT_TABLE_ID,created.$id,sort);
            say($("#productNotice"),"商品已新增");
        }

        closeProductModal();
        await loadProducts();

    }catch(e){
        console.error(e);

        /* 若資料儲存失敗，只清掉這次剛上傳的新圖片 */
        for(const uploadedId of uploadedThisSave){
            await deleteImage(uploadedId);
        }

        say($("#productNotice"),"儲存失敗："+e.message,"err");

    }finally{
        btn.disabled=false;
        btn.textContent="儲存商品";
    }
};

/* 按鈕 */
$("#addCategory").onclick=async()=>{
    try{
        await loadCategories();
        openCategoryModal();
    }catch(e){
        say($("#categoryNotice"),"分類讀取失敗："+e.message,"err");
    }
};
$("#categoryCancel").onclick=closeCategoryModal;
$("#categoryModal").onclick=e=>{if(e.target===$("#categoryModal")) closeCategoryModal()};

$("#addProduct").onclick=async()=>{
    try{
        await loadCategories();
        await loadProducts();
        if(!categories.length){
            say($("#productNotice"),"請先新增至少一個商品分類","err");
            return;
        }
        openProductModal();
    }catch(e){
        say($("#productNotice"),"分類讀取失敗："+e.message,"err");
    }
};
$("#productCancel").onclick=closeProductModal;
$("#productModal").onclick=e=>{if(e.target===$("#productModal")) closeProductModal()};

/* 登出 */
$("#logout").onclick=async()=>{
    try{ await account.deleteSession("current"); }
    catch(e){ console.warn(e); }
    finally{ location.replace("index.html"); }
};

/* 啟動 */
(async()=>{
    await guard();
    await loadCategories();
})();
</script>
