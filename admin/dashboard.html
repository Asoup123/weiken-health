<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>威肯管理後台</title>

<style>
*{box-sizing:border-box}
body{
    margin:0;
    font-family:"Microsoft JhengHei",Arial,sans-serif;
    background:#f5f5f3;
    color:#222;
}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
.app{
    min-height:100vh;
    display:grid;
    grid-template-columns:230px 1fr;
}
aside{
    background:#20211f;
    color:white;
    padding:30px 22px;
    display:flex;
    flex-direction:column;
}
.logo{
    font-size:12px;
    letter-spacing:4px;
    color:#aaa;
}
aside h1{
    font-size:20px;
    margin:8px 0 34px;
}
.nav-list{
    display:flex;
    flex-direction:column;
    gap:8px;
}
.nav{
    width:100%;
    border:0;
    text-align:left;
    padding:13px 14px;
    border-radius:9px;
    background:transparent;
    color:#ddd;
    font-weight:700;
}
.nav:hover{background:#2d2e2b}
.nav.active{
    background:white;
    color:#222;
}
.logout{
    margin-top:auto;
    padding:12px;
    border:1px solid #555;
    border-radius:9px;
    background:none;
    color:#ddd;
}
main{
    padding:42px;
    max-width:1300px;
    width:100%;
    margin:auto;
}
.page{display:none}
.page.active{display:block}
.top{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:28px;
    gap:20px;
}
h2{
    margin:0 0 7px;
    font-size:28px;
}
.top p{
    margin:0;
    color:#888;
}
.add,.save{
    border:0;
    border-radius:9px;
    background:#222;
    color:white;
    padding:13px 20px;
    font-weight:700;
}
.add:hover,.save:hover{background:#000}
button:disabled{
    opacity:.55;
    cursor:not-allowed;
}
.notice{
    display:none;
    margin-bottom:16px;
    padding:12px 14px;
    border-radius:8px;
}
.notice.show{display:block}
.notice.ok{
    background:#edf8ef;
    color:#16733c;
}
.notice.err{
    background:#fff1f1;
    color:#b42318;
}
.card{
    background:white;
    border:1px solid #e5e5e1;
    border-radius:14px;
    overflow:hidden;
}
.row{
    display:grid;
    grid-template-columns:90px 90px 1fr 170px;
    gap:18px;
    align-items:center;
    padding:15px 20px;
    border-bottom:1px solid #eee;
}
.row:last-child{border-bottom:0}
.product-row{
    grid-template-columns:90px 80px 1.25fr 1fr 170px;
}
.head{
    background:#fafafa;
    color:#888;
    font-size:13px;
    font-weight:700;
}
.thumb{
    width:64px;
    height:64px;
    border-radius:50%;
    object-fit:cover;
    background:#eee;
}
.product-thumb{border-radius:9px}
.noimg{
    display:grid;
    place-items:center;
    font-size:11px;
    color:#aaa;
}
.actions{
    display:flex;
    gap:8px;
}
.actions button{
    padding:8px 11px;
    border:1px solid #ddd;
    background:white;
    border-radius:7px;
}
.actions button:hover{background:#f5f5f5}
.danger{color:#b42318}
.sort-cell{
    display:flex;
    align-items:center;
    gap:10px;
    font-variant-numeric:tabular-nums;
}
.drag-handle{
    border:0;
    background:transparent;
    padding:8px 4px;
    color:#999;
    font-size:20px;
    line-height:1;
    cursor:grab;
    touch-action:none;
    user-select:none;
}
.drag-handle:active{cursor:grabbing}
.drag-ghost{opacity:.35;background:#f2f2ef}
.drag-chosen{box-shadow:0 8px 24px #00000014}
.dragging-body{user-select:none}
.state{
    padding:45px;
    text-align:center;
    color:#888;
}
.bad{color:#b42318}
.modal{
    position:fixed;
    inset:0;
    background:#0006;
    display:none;
    align-items:center;
    justify-content:center;
    padding:20px;
    z-index:999;
}
.modal.open{display:flex}
.panel{
    width:min(500px,100%);
    background:white;
    border-radius:16px;
    padding:28px;
    max-height:90vh;
    overflow:auto;
}
.panel h3{margin-top:0}
.field{margin:18px 0}
.field label{
    display:block;
    font-weight:700;
    font-size:14px;
    margin-bottom:8px;
}
.field input,.field select,.field textarea{
    width:100%;
    padding:12px;
    border:1px solid #ddd;
    border-radius:8px;
    background:white;
}
.preview{
    display:none;
    width:90px;
    height:90px;
    object-fit:cover;
    border-radius:50%;
    margin-top:12px;
}
.field textarea{min-height:180px;resize:vertical;line-height:1.7}

/* 商品多圖片管理 */
.product-image-help{
    margin-top:8px;
    color:#888;
    font-size:12px;
    line-height:1.6;
}
.product-image-grid{
    display:grid;
    grid-template-columns:repeat(4,minmax(0,1fr));
    gap:12px;
    margin-top:14px;
}
.product-image-item{
    position:relative;
    aspect-ratio:1/1;
    overflow:hidden;
    border:1px solid #e4e4df;
    border-radius:10px;
    background:#fafafa;
    cursor:grab;
    user-select:none;
}
.product-image-item:active{cursor:grabbing}
.product-image-item img{
    width:100%;
    height:100%;
    display:block;
    object-fit:contain;
    background:#fff;
}
.product-image-remove{
    position:absolute;
    top:6px;
    right:6px;
    width:28px;
    height:28px;
    padding:0;
    display:grid;
    place-items:center;
    border:0;
    border-radius:50%;
    background:rgba(25,25,25,.78);
    color:#fff;
    font-size:18px;
    line-height:1;
    cursor:pointer;
}
.product-image-remove:hover{background:#b42318}
.product-image-badge{
    position:absolute;
    left:7px;
    bottom:7px;
    padding:4px 7px;
    border-radius:999px;
    background:rgba(255,255,255,.92);
    color:#333;
    font-size:11px;
    box-shadow:0 2px 8px #00000012;
}
.product-image-ghost{opacity:.3}
.product-image-chosen{box-shadow:0 8px 24px #0002}
.modal-actions{
    display:flex;
    justify-content:flex-end;
    gap:10px;
    margin-top:25px;
}
.cancel{
    padding:11px 16px;
    border:1px solid #ddd;
    background:white;
    border-radius:8px;
}
@media(max-width:760px){
    .app{display:block}
    aside{padding:18px}
    aside h1{margin-bottom:15px}
    .nav-list{flex-direction:row}
    .nav{text-align:center}
    .logout{margin-top:15px;width:100%}
    main{padding:24px 15px}
    .top{align-items:flex-start;flex-direction:column}
    .row,.product-row{grid-template-columns:70px 65px 1fr}
    .row .actions,.product-row .actions{grid-column:2/4}
    .product-row .category-cell{grid-column:2/4}
    .head{display:none}
    .product-image-grid{grid-template-columns:repeat(3,minmax(0,1fr))}
}
@media(max-width:480px){
    .product-image-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
}


/* =========================================================
   兩層式商品分類管理
========================================================= */
.category-tree-card{
    background:white;
    border:1px solid #e5e5e1;
    border-radius:14px;
    overflow:hidden;
}
.category-tree{
    padding:8px 0;
}
.category-group{
    border-bottom:1px solid #ecece8;
}
.category-group:last-child{border-bottom:0}
.category-parent-row{
    display:grid;
    grid-template-columns:48px 72px minmax(180px,1fr) 180px;
    gap:16px;
    align-items:center;
    min-height:82px;
    padding:12px 20px;
    background:#fff;
}
.category-parent-row:hover{background:#fafbf9}
.category-parent-name{
    display:flex;
    align-items:center;
    gap:10px;
    min-width:0;
}
.category-parent-name strong{
    font-size:16px;
}
.category-kind{
    display:inline-flex;
    align-items:center;
    padding:4px 8px;
    border-radius:999px;
    background:#edf3ee;
    color:#315d43;
    font-size:11px;
    font-weight:700;
    white-space:nowrap;
}
.category-tree-thumb{
    width:54px;
    height:54px;
    border-radius:50%;
    object-fit:cover;
    background:#eee;
}
.category-tree-thumb.noimg{
    display:grid;
    place-items:center;
    color:#aaa;
    font-size:10px;
}
.category-parent-actions{
    display:flex;
    justify-content:flex-end;
    gap:8px;
    flex-wrap:wrap;
}
.category-parent-actions button,
.category-child-actions button{
    padding:8px 10px;
    border:1px solid #ddd;
    background:#fff;
    border-radius:7px;
}
.category-parent-actions button:hover,
.category-child-actions button:hover{background:#f5f5f5}
.add-child{
    color:#315d43;
    border-color:#cbd8ce!important;
    background:#f7faf7!important;
}
.category-children{
    margin:0 20px 14px 88px;
    border-left:2px solid #e2e8e3;
}
.category-child-row{
    display:grid;
    grid-template-columns:42px minmax(180px,1fr) 150px;
    gap:12px;
    align-items:center;
    min-height:54px;
    padding:7px 12px 7px 14px;
    border-bottom:1px solid #f0f0ed;
    background:#fbfbfa;
}
.category-child-row:last-child{border-bottom:0}
.category-child-row:hover{background:#f6f8f5}
.category-child-name{
    display:flex;
    align-items:center;
    gap:9px;
    min-width:0;
}
.category-child-name::before{
    content:"└";
    color:#9a9f99;
}
.category-child-actions{
    display:flex;
    justify-content:flex-end;
    gap:8px;
}
.category-empty-child{
    padding:13px 14px;
    color:#aaa;
    font-size:13px;
    background:#fbfbfa;
}
.category-drag-handle{
    border:0;
    background:transparent;
    padding:8px 4px;
    color:#999;
    font-size:20px;
    line-height:1;
    cursor:grab;
    touch-action:none;
    user-select:none;
}
.category-drag-handle:active{cursor:grabbing}
.category-child-sort{
    color:#aaa;
    font-size:12px;
    margin-left:auto;
}
.category-parent-ghost,
.category-child-ghost{opacity:.3;background:#eef3ee}
.category-parent-chosen,
.category-child-chosen{box-shadow:0 8px 24px #00000014}

.category-type-note{
    margin:0 0 18px;
    padding:12px 14px;
    border-radius:9px;
    background:#f5f7f4;
    color:#657066;
    font-size:13px;
    line-height:1.7;
}
.category-parent-select-wrap{display:none}
.category-parent-select-wrap.show{display:block}

@media(max-width:760px){
    .category-parent-row{
        grid-template-columns:38px 54px 1fr;
        gap:10px;
        padding:12px;
    }
    .category-parent-actions{
        grid-column:2/4;
        justify-content:flex-start;
    }
    .category-tree-thumb{
        width:46px;
        height:46px;
    }
    .category-children{
        margin:0 12px 12px 48px;
    }
    .category-child-row{
        grid-template-columns:34px 1fr;
    }
    .category-child-actions{
        grid-column:2/3;
        justify-content:flex-start;
    }
}


/* =========================================================
   商品管理：搜尋 / 分類篩選
========================================================= */
.product-tools{
    display:flex;
    align-items:center;
    gap:12px;
    margin:0 0 16px;
    padding:14px;
    background:#fff;
    border:1px solid #e5e5e1;
    border-radius:12px;
}
.product-search-wrap{
    position:relative;
    flex:1 1 360px;
}
.product-search-wrap input,
.product-filter-select{
    width:100%;
    height:44px;
    padding:0 13px;
    border:1px solid #dcdcd7;
    border-radius:9px;
    background:#fff;
    color:#222;
    outline:none;
}
.product-search-wrap input{
    padding-right:42px;
}
.product-search-wrap input:focus,
.product-filter-select:focus{
    border-color:#8d9c91;
    box-shadow:0 0 0 3px rgba(49,93,67,.08);
}
.product-search-icon{
    position:absolute;
    right:13px;
    top:50%;
    transform:translateY(-50%);
    color:#888;
    pointer-events:none;
}
.product-filter-wrap{
    flex:0 1 300px;
    min-width:220px;
}
.product-count{
    flex:0 0 auto;
    min-width:105px;
    text-align:right;
    color:#777;
    font-size:13px;
    white-space:nowrap;
}
.product-count strong{
    color:#315d43;
    font-size:15px;
}
.product-filter-note{
    margin:-4px 0 16px;
    color:#999;
    font-size:12px;
}
.product-filtered .drag-handle{
    opacity:.3;
    cursor:not-allowed;
    pointer-events:none;
}

@media(max-width:760px){
    .product-tools{
        align-items:stretch;
        flex-direction:column;
    }
    .product-search-wrap,
    .product-filter-wrap{
        width:100%;
        min-width:0;
        flex:auto;
    }
    .product-count{
        min-width:0;
        text-align:left;
    }
}

</style>
</head>

<body>
<div class="app">
<aside>
    <div class="logo">WEIKEN</div>
    <h1>威肯管理後台</h1>

    <div class="nav-list">
        <button class="nav active" data-page="categoriesPage">商品分類</button>
        <button class="nav" data-page="productsPage">商品管理</button>
    </div>

    <button id="logout" class="logout">登出</button>
</aside>

<main>
    <section id="categoriesPage" class="page active">
        <div class="top">
            <div>
                <h2>商品分類管理</h2>
                <p>新增、修改、刪除官網的商品分類。</p>
            </div>
            <button id="addCategory" class="add">＋ 新增大分類</button>
        </div>

        <div id="categoryNotice" class="notice"></div>

        <div class="category-tree-card">
            <div id="categoryList" class="category-tree">
                <div class="state">正在讀取分類...</div>
            </div>
        </div>
    </section>

    <section id="productsPage" class="page">
        <div class="top">
            <div>
                <h2>商品管理</h2>
                <p>新增商品、選擇分類、上傳商品主圖與調整排序。</p>
            </div>
            <button id="addProduct" class="add">＋ 新增商品</button>
        </div>

        <div id="productNotice" class="notice"></div>

        <div class="product-tools">
            <div class="product-search-wrap">
                <input id="productSearch" type="search" placeholder="搜尋商品名稱…" autocomplete="off">
                <span class="product-search-icon">⌕</span>
            </div>

            <div class="product-filter-wrap">
                <select id="productCategoryFilter" class="product-filter-select">
                    <option value="all">全部分類</option>
                </select>
            </div>

            <div id="productCount" class="product-count">
                共 <strong>0</strong> 項商品
            </div>
        </div>
        <div class="product-filter-note">搜尋與分類只影響目前顯示；篩選中會暫停拖曳排序，清除條件後即可繼續排序。</div>

        <div class="card">
            <div class="row product-row head">
                <div>圖片</div>
                <div>順序</div>
                <div>商品名稱</div>
                <div>所屬分類</div>
                <div>操作</div>
            </div>
            <div id="productList">
                <div class="state">正在讀取商品...</div>
            </div>
        </div>
    </section>
</main>
</div>

<!-- 分類視窗 -->
<div id="categoryModal" class="modal">
<div class="panel">
    <h3 id="categoryTitle">新增大分類</h3>
    <div id="categoryTypeNote" class="category-type-note">
        大分類會顯示在官網最上層分類列；小分類會收在所屬大分類下面。
    </div>
    <form id="categoryForm">
        <div class="field">
            <label>分類名稱</label>
            <input id="categoryName" required placeholder="例如：輪椅">
        </div>

        <div id="categoryParentWrap" class="field category-parent-select-wrap">
            <label>所屬大分類</label>
            <select id="categoryParent"></select>
        </div>

        <div class="field">
            <label>排序</label>
            <input id="categorySort" required type="number" min="1" value="1">
        </div>

        <div class="field" id="categoryImageField">
            <label>分類圖片</label>
            <input id="categoryImage" type="file" accept="image/*">
            <img id="categoryPreview" class="preview" alt="">
        </div>

        <div class="modal-actions">
            <button id="categoryCancel" type="button" class="cancel">取消</button>
            <button id="categorySave" class="save">儲存分類</button>
        </div>
    </form>
</div>
</div>

<!-- 商品視窗 -->
<div id="productModal" class="modal">
<div class="panel">
    <h3 id="productTitle">新增商品</h3>
    <form id="productForm">
        <div class="field">
            <label>商品名稱</label>
            <input id="productName" required placeholder="例如：鋁合金輪椅">
        </div>
        <div class="field">
            <label>所屬分類</label>
            <select id="productCategory" required>
                <option value="">正在讀取分類...</option>
            </select>
        </div>
        <div class="field">
            <label>排序</label>
            <input id="productSort" required type="number" min="0" value="1">
        </div>
        <div class="field">
            <label>商品資訊</label>
            <textarea id="productInfo" placeholder="請輸入商品介紹、特色、尺寸、規格等資訊"></textarea>
        </div>
        <div class="field">
            <label>商品圖片</label>
            <input id="productImage" type="file" accept="image/*" multiple>
            <div class="product-image-help">可一次選擇多張圖片。拖曳圖片即可調整順序，第 1 張會作為商品主圖；右上角 × 可移除圖片。</div>
            <div id="productImageGrid" class="product-image-grid"></div>
        </div>
        <div class="modal-actions">
            <button id="productCancel" type="button" class="cancel">取消</button>
            <button id="productSave" class="save">儲存商品</button>
        </div>
    </form>
</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/appwrite@17.0.0"></script>
<script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.6/Sortable.min.js"></script>
<script>
const ENDPOINT="https://sgp.cloud.appwrite.io/v1";
const PROJECT_ID="6aab96e3000fa724b62d";
const DATABASE_ID="6aab978f00363c84475b";
const CATEGORY_TABLE_ID="categories";
const PRODUCT_TABLE_ID="products";
const BUCKET_ID="weiken-images";
const ADMIN_TEAM_ID="6aaba9fa001fa283e8a7";

const client=new Appwrite.Client().setEndpoint(ENDPOINT).setProject(PROJECT_ID);
const account=new Appwrite.Account(client);
const db=new Appwrite.Databases(client);
const storage=new Appwrite.Storage(client);

let categories=[];
let products=[];
let editingCategory=null;
let editingProduct=null;
let productImageItems=[];
let removedProductImageIds=new Set();
let productImageSortable=null;
let categorySortable=null;
let childCategorySortables=[];
let productSortable=null;
let categoryModalMode="parent";
let categoryModalParentId="";
let productSearchKeyword="";
let productCategoryFilter="all";

const $=s=>document.querySelector(s);

function esc(v){
    return String(v ?? "").replace(/[&<>"']/g,x=>({
        "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
    }[x]));
}

function fileUrl(id){
    if(!id) return "";
    return `${ENDPOINT}/storage/buckets/${BUCKET_ID}/files/${id}/view?project=${PROJECT_ID}`;
}

function say(el,text,type="ok"){
    el.textContent=text;
    el.className="notice show "+type;
    setTimeout(()=>el.className="notice",3500);
}

async function guard(){
    try{ await account.get(); }
    catch(e){ location.replace("index.html"); }
}

async function uploadImage(file){
    if(!file) return "";
    const upload=await storage.createFile(
        BUCKET_ID,
        Appwrite.ID.unique(),
        file,
        [
            Appwrite.Permission.read(Appwrite.Role.any()),
            Appwrite.Permission.update(Appwrite.Role.team(ADMIN_TEAM_ID)),
            Appwrite.Permission.delete(Appwrite.Role.team(ADMIN_TEAM_ID))
        ]
    );
    return upload.$id;
}

async function deleteImage(id){
    if(!id) return;
    try{ await storage.deleteFile(BUCKET_ID,id); }
    catch(e){ console.warn("圖片刪除失敗",e); }
}

function nextSort(items){
    if(!items.length) return 1;
    return Math.max(...items.map(x=>Number(x.sort_order)||0))+1;
}

async function resequence(tableId, orderedIds){
    await Promise.all(
        orderedIds.map((id,index)=>
            db.updateDocument(
                DATABASE_ID,
                tableId,
                id,
                {sort_order:index+1}
            )
        )
    );
}

/* 把指定項目插入第 desired 位，其他項目自動順延 */
async function placeAt(tableId, itemId, desired){
    const result=await db.listDocuments(
        DATABASE_ID,
        tableId,
        [Appwrite.Query.orderAsc("sort_order"),Appwrite.Query.limit(100)]
    );

    const others=result.documents.filter(x=>x.$id!==itemId);
    const position=Math.max(1,Math.min(Number(desired)||1,others.length+1));
    const ids=others.map(x=>x.$id);
    ids.splice(position-1,0,itemId);
    await resequence(tableId,ids);
}

async function normalizeTable(tableId){
    const result=await db.listDocuments(
        DATABASE_ID,
        tableId,
        [Appwrite.Query.orderAsc("sort_order"),Appwrite.Query.limit(100)]
    );
    await resequence(tableId,result.documents.map(x=>x.$id));
}

function makeSortable(el,tableId,type){
    if(!el || !window.Sortable) return null;

    return new Sortable(el,{
        animation:170,
        handle:".drag-handle",
        draggable:".sortable-row",
        ghostClass:"drag-ghost",
        chosenClass:"drag-chosen",

        /* 靠近瀏覽器上下邊界時，自動捲動畫面 */
        scroll:true,
        bubbleScroll:true,
        scrollSensitivity:100,
        scrollSpeed:18,

        onStart(){
            document.body.classList.add("dragging-body");
        },

        async onEnd(){
            document.body.classList.remove("dragging-body");

            const ids=[...el.querySelectorAll(".sortable-row")]
                .map(row=>row.dataset.id);

            if(!ids.length) return;

            const noticeEl=type==="category"
                ? $("#categoryNotice")
                : $("#productNotice");

            try{
                say(noticeEl,"正在儲存新順序...");
                await resequence(tableId,ids);

                if(type==="category"){
                    await loadCategories();
                    say(noticeEl,"分類順序已更新");
                }else{
                    await loadProducts();
                    say(noticeEl,"商品順序已更新");
                }
            }catch(e){
                console.error(e);
                say(noticeEl,"排序儲存失敗："+e.message,"err");
                if(type==="category") await loadCategories();
                else await loadProducts();
            }
        }
    });
}

/* ================= 分類 ================= */

function parentCategories(){
    return categories
        .filter(c=>!c.parent_id)
        .sort((a,b)=>(Number(a.sort_order)||0)-(Number(b.sort_order)||0));
}

function childCategories(parentId){
    return categories
        .filter(c=>c.parent_id===parentId)
        .sort((a,b)=>(Number(a.sort_order)||0)-(Number(b.sort_order)||0));
}

function categoryById(id){
    return categories.find(c=>c.$id===id);
}

function nextCategorySort(parentId=""){
    const items=parentId ? childCategories(parentId) : parentCategories();
    return nextSort(items);
}

async function resequenceCategoryGroup(parentId, orderedIds){
    await Promise.all(
        orderedIds.map((id,index)=>
            db.updateDocument(
                DATABASE_ID,
                CATEGORY_TABLE_ID,
                id,
                {sort_order:index+1}
            )
        )
    );
}

function destroyCategorySortables(){
    if(categorySortable){
        categorySortable.destroy();
        categorySortable=null;
    }

    childCategorySortables.forEach(s=>{
        try{s.destroy()}catch(e){}
    });
    childCategorySortables=[];
}

function setupCategoryTreeSortables(){
    destroyCategorySortables();

    const tree=$("#categoryList");
    if(!tree || !window.Sortable) return;

    categorySortable=new Sortable(tree,{
        animation:170,
        handle:".category-drag-handle",
        draggable:".category-group",
        ghostClass:"category-parent-ghost",
        chosenClass:"category-parent-chosen",
        scroll:true,
        bubbleScroll:true,
        scrollSensitivity:100,
        scrollSpeed:18,

        async onEnd(){
            const ids=[...tree.querySelectorAll(":scope > .category-group")]
                .map(el=>el.dataset.id)
                .filter(Boolean);

            try{
                say($("#categoryNotice"),"正在儲存大分類順序...");
                await resequenceCategoryGroup("",ids);
                await loadCategories();
                say($("#categoryNotice"),"大分類順序已更新");
            }catch(e){
                console.error(e);
                say($("#categoryNotice"),"大分類排序失敗："+e.message,"err");
                await loadCategories();
            }
        }
    });

    document.querySelectorAll(".category-children[data-parent-id]").forEach(container=>{
        const parentId=container.dataset.parentId;

        const sortable=new Sortable(container,{
            animation:160,
            handle:".category-drag-handle",
            draggable:".category-child-row",
            ghostClass:"category-child-ghost",
            chosenClass:"category-child-chosen",
            scroll:true,
            bubbleScroll:true,
            scrollSensitivity:90,
            scrollSpeed:16,

            async onEnd(){
                const ids=[...container.querySelectorAll(".category-child-row")]
                    .map(el=>el.dataset.id)
                    .filter(Boolean);

                try{
                    say($("#categoryNotice"),"正在儲存小分類順序...");
                    await resequenceCategoryGroup(parentId,ids);
                    await loadCategories();
                    say($("#categoryNotice"),"小分類順序已更新");
                }catch(e){
                    console.error(e);
                    say($("#categoryNotice"),"小分類排序失敗："+e.message,"err");
                    await loadCategories();
                }
            }
        });

        childCategorySortables.push(sortable);
    });
}

                                <button
                                    type="button"

                                    <div
                                        class="category-child-row"

                                            class="category-drag-handle"
                                            title="拖曳小分類排序"

                                        <div class="category-child-actions">

function fillCategorySelect(selected=""){
    const select=$("#productCategory");
    const parents=parentCategories();

    if(!parents.length){
        select.innerHTML='<option value="">目前沒有商品分類</option>';
        return;
    }

    const options=[];

    parents.forEach(parent=>{
        const children=childCategories(parent.$id);

        /* 有小分類時，商品只選小分類 */
        if(children.length){
            options.push(
                `<optgroup label="${esc(parent.name)}">`+
                children.map(child=>
                    `<option value="${esc(child.$id)}" ${child.$id===selected?"selected":""}>${esc(child.name)}</option>`
                ).join("")+
                `</optgroup>`
            );
        }else{
            /* 尚未建立小分類的大分類仍可暫時使用，避免舊資料卡住 */
            options.push(
                `<option value="${esc(parent.$id)}" ${parent.$id===selected?"selected":""}>${esc(parent.name)}</option>`
            );
        }
    });

    select.innerHTML=
        '<option value="">請選擇分類</option>'+
        options.join("");
}

function fillParentSelect(selectedParentId=""){
    const select=$("#categoryParent");
    const parents=parentCategories();

    select.innerHTML=parents.map(parent=>`
        <option
            value="${esc(parent.$id)}"
            ${parent.$id===selectedParentId?"selected":""}
        >${esc(parent.name)}</option>
    `).join("");
}

function openCategoryModal(d=null,mode="parent",parentId=""){
    editingCategory=d;

    if(d){
        categoryModalMode=d.parent_id ? "child" : "parent";
        categoryModalParentId=d.parent_id || "";
    }else{
        categoryModalMode=mode;
        categoryModalParentId=parentId || "";
    }

    const isChild=categoryModalMode==="child";

    $("#categoryTitle").textContent=d
        ? (isChild ? "修改小分類" : "修改大分類")
        : (isChild ? "新增小分類" : "新增大分類");

    $("#categoryTypeNote").textContent=isChild
        ? "小分類會顯示在所屬大分類下方，商品可指定到這個小分類。"
        : "大分類會顯示在官網最上層分類列，點擊後再展開它的小分類。";

    $("#categoryName").value=d?.name || "";

    $("#categoryParentWrap").classList.toggle("show",isChild);

    if(isChild){
        fillParentSelect(categoryModalParentId);
        $("#categoryParent").value=categoryModalParentId;
    }

    $("#categorySort").value=
        d?.sort_order ?? nextCategorySort(categoryModalParentId);

    $("#categoryImage").value="";

    /*
      小分類目前不需要圖片。
      大分類保留原本圖片欄位，避免破壞既有資料。
    */
    $("#categoryImageField").style.display=isChild ? "none" : "block";

    if(!isChild && d?.image_id){
        $("#categoryPreview").src=fileUrl(d.image_id);
        $("#categoryPreview").style.display="block";
    }else{
        $("#categoryPreview").removeAttribute("src");
        $("#categoryPreview").style.display="none";
    }

    $("#categoryModal").classList.add("open");
}

function closeCategoryModal(){
    $("#categoryModal").classList.remove("open");
    editingCategory=null;
    categoryModalMode="parent";
    categoryModalParentId="";
    $("#categoryForm").reset();
    $("#categoryParentWrap").classList.remove("show");
    $("#categoryImageField").style.display="block";
    $("#categoryPreview").removeAttribute("src");
    $("#categoryPreview").style.display="none";
}

window.addChildCategory=parentId=>{
    const parent=categoryById(parentId);

    if(!parent){
        say($("#categoryNotice"),"找不到這個大分類","err");
        return;
    }

    openCategoryModal(null,"child",parentId);
};

window.editCategory=async id=>{
    try{
        const d=await db.getDocument(
            DATABASE_ID,
            CATEGORY_TABLE_ID,
            id
        );

        openCategoryModal(d);

    }catch(e){
        say(
            $("#categoryNotice"),
            "讀取分類失敗："+e.message,
            "err"
        );
    }
};

window.removeCategory=async id=>{
    const target=categoryById(id);

    if(!target){
        return say(
            $("#categoryNotice"),
            "找不到這個分類",
            "err"
        );
    }

    const isParent=!target.parent_id;
    const children=isParent ? childCategories(target.$id) : [];

    if(isParent && children.length){
        alert(
            `「${target.name}」底下還有 ${children.length} 個小分類。\n\n請先刪除或移動這些小分類，再刪除大分類。`
        );
        return;
    }

    const usedProducts=products.filter(
        product=>product.category_id===target.$id
    );

    if(usedProducts.length){
        alert(
            `目前有 ${usedProducts.length} 個商品使用「${target.name}」。\n\n請先把這些商品改到其他分類，再刪除。`
        );
        return;
    }

    if(!confirm(`確定要刪除「${target.name}」嗎？`)){
        return;
    }

    try{
        await db.deleteDocument(
            DATABASE_ID,
            CATEGORY_TABLE_ID,
            target.$id
        );

        if(target.image_id){
            await deleteImage(target.image_id);
        }

        const siblings=target.parent_id
            ? childCategories(target.parent_id).filter(x=>x.$id!==target.$id)
            : parentCategories().filter(x=>x.$id!==target.$id);

        if(siblings.length){
            await resequenceCategoryGroup(
                target.parent_id || "",
                siblings.map(x=>x.$id)
            );
        }

        say($("#categoryNotice"),"分類已刪除");
        await loadCategories();

    }catch(e){
        console.error(e);
        say(
            $("#categoryNotice"),
            "刪除失敗："+e.message,
            "err"
        );
    }
};

$("#categoryImage").onchange=()=>{
    const file=$("#categoryImage").files[0];
    if(!file) return;

    $("#categoryPreview").src=URL.createObjectURL(file);
    $("#categoryPreview").style.display="block";
};

$("#categoryForm").onsubmit=async e=>{
    e.preventDefault();

    const name=$("#categoryName").value.trim();
    const sort=Number($("#categorySort").value);
    const isChild=categoryModalMode==="child";

    let parentId=isChild
        ? $("#categoryParent").value
        : "";

    if(!name){
        return say(
            $("#categoryNotice"),
            "請輸入分類名稱",
            "err"
        );
    }

    if(isChild && !parentId){
        return say(
            $("#categoryNotice"),
            "請選擇所屬大分類",
            "err"
        );
    }

    if(
        editingCategory &&
        isChild &&
        editingCategory.$id===parentId
    ){
        return say(
            $("#categoryNotice"),
            "分類不能設成自己的小分類",
            "err"
        );
    }

    const btn=$("#categorySave");
    btn.disabled=true;
    btn.textContent="儲存中...";

    let uploaded="";

    try{
        let imageId=isChild
            ? ""
            : (editingCategory?.image_id || "");

        const file=isChild
            ? null
            : $("#categoryImage").files[0];

        if(file){
            uploaded=await uploadImage(file);
            imageId=uploaded;
        }

        const data={
            name:name,
            sort_order:sort,
            image_id:imageId,
            parent_id:parentId
        };

        if(editingCategory){
            const oldImage=editingCategory.image_id;
            const oldParentId=editingCategory.parent_id || "";
            const id=editingCategory.$id;

            await db.updateDocument(
                DATABASE_ID,
                CATEGORY_TABLE_ID,
                id,
                data
            );

            /*
              若小分類被移到另一個大分類：
              先整理舊群組，再把它插入新群組。
            */
            if(oldParentId!==parentId){
                const oldSiblings=categories
                    .filter(c=>
                        c.$id!==id &&
                        (c.parent_id || "")===oldParentId
                    )
                    .sort((a,b)=>
                        (Number(a.sort_order)||0)-
                        (Number(b.sort_order)||0)
                    );

                if(oldSiblings.length){
                    await resequenceCategoryGroup(
                        oldParentId,
                        oldSiblings.map(x=>x.$id)
                    );
                }
            }

            const newGroup=categories
                .filter(c=>
                    c.$id!==id &&
                    (c.parent_id || "")===parentId
                )
                .sort((a,b)=>
                    (Number(a.sort_order)||0)-
                    (Number(b.sort_order)||0)
                )
                .map(x=>x.$id);

            const position=Math.max(
                1,
                Math.min(sort||1,newGroup.length+1)
            );

            newGroup.splice(position-1,0,id);

            await resequenceCategoryGroup(
                parentId,
                newGroup
            );

            if(
                !isChild &&
                file &&
                oldImage &&
                oldImage!==imageId
            ){
                await deleteImage(oldImage);
            }

            /*
              若大分類被改成小分類，舊的大分類圖片不再使用。
              一般情況 UI 不會讓既有大分類直接改型態，
              這裡仍做防呆。
            */
            if(isChild && oldImage){
                await deleteImage(oldImage);
            }

            say($("#categoryNotice"),"分類已更新");

        }else{
            const created=await db.createDocument(
                DATABASE_ID,
                CATEGORY_TABLE_ID,
                Appwrite.ID.unique(),
                data,
                [
                    Appwrite.Permission.read(Appwrite.Role.any()),
                    Appwrite.Permission.update(Appwrite.Role.team(ADMIN_TEAM_ID)),
                    Appwrite.Permission.delete(Appwrite.Role.team(ADMIN_TEAM_ID))
                ]
            );

            const group=categories
                .filter(c=>(c.parent_id || "")===parentId)
                .sort((a,b)=>
                    (Number(a.sort_order)||0)-
                    (Number(b.sort_order)||0)
                )
                .map(x=>x.$id);

            const position=Math.max(
                1,
                Math.min(sort||1,group.length+1)
            );

            group.splice(position-1,0,created.$id);

            await resequenceCategoryGroup(
                parentId,
                group
            );

            say(
                $("#categoryNotice"),
                isChild ? "小分類已新增" : "大分類已新增"
            );
        }

        closeCategoryModal();
        await loadCategories();

    }catch(e){
        console.error(e);

        if(uploaded){
            await deleteImage(uploaded);
        }

        say(
            $("#categoryNotice"),
            "儲存失敗："+e.message,
            "err"
        );

    }finally{
        btn.disabled=false;
        btn.textContent="儲存分類";
    }
};

/* ================= 商品 ================= */

function productMainImageId(product){
    if(Array.isArray(product?.image_ids) && product.image_ids.length){
        return product.image_ids[0];
    }

    if(typeof product?.image_ids==="string" && product.image_ids.trim()){
        try{
            const parsed=JSON.parse(product.image_ids);
            if(Array.isArray(parsed) && parsed.length) return parsed[0];
        }catch(e){}
    }

    return product?.image_id || "";
}

function categoryDisplayName(categoryId){
    const category=categoryById(categoryId);
    if(!category) return "分類已不存在";

    if(category.parent_id){
        const parent=categoryById(category.parent_id);
        return parent
            ? `${parent.name} › ${category.name}`
            : category.name;
    }

    return category.name;
}

function fillProductCategoryFilter(){
    const select=$("#productCategoryFilter");
    if(!select) return;

    const current=productCategoryFilter;
    const options=['<option value="all">全部分類</option>'];

    parentCategories().forEach(parent=>{
        const children=childCategories(parent.$id);

        if(children.length){
            options.push(
                `<optgroup label="${esc(parent.name)}">`+
                `<option value="parent:${esc(parent.$id)}">${esc(parent.name)}（全部小分類）</option>`+
                children.map(child=>
                    `<option value="${esc(child.$id)}">${esc(parent.name)} › ${esc(child.name)}</option>`
                ).join("")+
                `</optgroup>`
            );
        }else{
            options.push(
                `<option value="${esc(parent.$id)}">${esc(parent.name)}</option>`
            );
        }
    });

    select.innerHTML=options.join("");

    const valid=[...select.options].some(option=>option.value===current);
    productCategoryFilter=valid ? current : "all";
    select.value=productCategoryFilter;
}

function productMatchesAdminFilter(product){
    const keyword=productSearchKeyword.trim().toLowerCase();

    if(keyword && !String(product.name || "").toLowerCase().includes(keyword)){
        return false;
    }

    if(productCategoryFilter==="all"){
        return true;
    }

    if(productCategoryFilter.startsWith("parent:")){
        const parentId=productCategoryFilter.slice(7);
        const allowedIds=new Set([
            parentId,
            ...childCategories(parentId).map(child=>child.$id)
        ]);
        return allowedIds.has(product.category_id);
    }

    return product.category_id===productCategoryFilter;
}

function renderProductList(){
    const list=$("#productList");
    const count=$("#productCount");
    const visible=products.filter(productMatchesAdminFilter);
    const filtering=
        productSearchKeyword.trim()!=="" ||
        productCategoryFilter!=="all";

    $("#productsPage")?.classList.toggle("product-filtered",filtering);

    if(count){
        count.innerHTML=`共 <strong>${visible.length}</strong> 項商品`;
    }

    if(!products.length){
        list.innerHTML='<div class="state">目前沒有商品，請按「新增商品」。</div>';
        if(productSortable){
            productSortable.destroy();
            productSortable=null;
        }
        return;
    }

    if(!visible.length){
        list.innerHTML='<div class="state">找不到符合條件的商品。</div>';
        if(productSortable){
            productSortable.destroy();
            productSortable=null;
        }
        return;
    }

    list.innerHTML=visible.map(d=>`
        <div class="row product-row sortable-row" data-id="${d.$id}">
            <div>${productMainImageId(d)
                ? `<img class="thumb product-thumb" src="${fileUrl(productMainImageId(d))}" alt="${esc(d.name)}">`
                : '<div class="thumb product-thumb noimg">無圖片</div>'}</div>
            <div class="sort-cell"><span class="drag-handle" title="${filtering ? "搜尋或篩選中暫停拖曳排序" : "拖曳排序"}">☰</span><span>${esc(d.sort_order)}</span></div>
            <div><strong>${esc(d.name)}</strong></div>
            <div class="category-cell">${esc(categoryDisplayName(d.category_id))}</div>
            <div class="actions">
                <button onclick="editProduct('${d.$id}')">修改</button>
                <button class="danger" onclick="removeProduct('${d.$id}')">刪除</button>
            </div>
        </div>
    `).join("");

    if(productSortable){
        productSortable.destroy();
        productSortable=null;
    }

    /*
      只有「顯示全部商品」時才允許拖曳排序。
      避免在搜尋/分類篩選後只拿部分商品重新編號，破壞完整商品順序。
    */
    if(!filtering){
        productSortable=makeSortable(list,PRODUCT_TABLE_ID,"product");
    }
}

async function loadProducts(){
    const list=$("#productList");
    list.innerHTML='<div class="state">正在讀取商品...</div>';

    try{
        const result=await db.listDocuments(
            DATABASE_ID,
            PRODUCT_TABLE_ID,
            [Appwrite.Query.orderAsc("sort_order"),Appwrite.Query.limit(100)]
        );

        products=result.documents;
        fillProductCategoryFilter();
        renderProductList();

    }catch(e){
        console.error(e);
        list.innerHTML=`<div class="state bad">讀取失敗：${esc(e.message)}</div>`;
    }
}

function getStoredProductImageIds(product){
    if(!product) return [];

    let ids=[];
    if(Array.isArray(product.image_ids)){
        ids=product.image_ids.filter(Boolean);
    }else if(typeof product.image_ids==="string" && product.image_ids.trim()){
        try{
            const parsed=JSON.parse(product.image_ids);
            if(Array.isArray(parsed)) ids=parsed.filter(Boolean);
        }catch(e){
            ids=product.image_ids.split(",").map(v=>v.trim()).filter(Boolean);
        }
    }

    if(product.image_id && !ids.includes(product.image_id)){
        ids.unshift(product.image_id);
    }

    return [...new Set(ids)];
}

function revokeNewImageUrls(){
    productImageItems.forEach(item=>{
        if(item.isNew && item.url) URL.revokeObjectURL(item.url);
    });
}

function renderProductImageGrid(){
    const grid=$("#productImageGrid");

    grid.innerHTML=productImageItems.map((item,index)=>`
        <div class="product-image-item" data-key="${esc(item.key)}">
            <img src="${esc(item.url)}" alt="商品圖片 ${index+1}">
            <button
                type="button"
                class="product-image-remove"
                data-key="${esc(item.key)}"
                aria-label="移除這張圖片"
                title="移除圖片"
            >×</button>
            ${index===0 ? '<span class="product-image-badge">主圖</span>' : ''}
        </div>
    `).join("");

    if(productImageSortable) productImageSortable.destroy();

    productImageSortable=new Sortable(grid,{
        animation:160,
        draggable:".product-image-item",
        ghostClass:"product-image-ghost",
        chosenClass:"product-image-chosen",
        onEnd(){
            const order=[...grid.querySelectorAll(".product-image-item")]
                .map(el=>el.dataset.key);

            productImageItems=order
                .map(key=>productImageItems.find(item=>item.key===key))
                .filter(Boolean);

            renderProductImageGrid();
        }
    });
}

function addSelectedProductImages(files){
    [...files].forEach(file=>{
        if(!file.type.startsWith("image/")) return;

        productImageItems.push({
            key:"new-"+crypto.randomUUID(),
            id:"",
            file,
            url:URL.createObjectURL(file),
            isNew:true
        });
    });

    renderProductImageGrid();
}

async function openProductModal(d=null){
    editingProduct=d;
    removedProductImageIds=new Set();
    revokeNewImageUrls();
    productImageItems=[];

    $("#productTitle").textContent=d?"修改商品":"新增商品";
    $("#productName").value=d?.name || "";
    $("#productSort").value=d?.sort_order ?? nextSort(products);

    const oldInfoParts=[];
    if(d?.features) oldInfoParts.push(d.features);
    if(d?.specifications) oldInfoParts.push(d.specifications);

    $("#productInfo").value=
        d?.product_info ||
        oldInfoParts.join("\n\n");

    $("#productImage").value="";
    fillCategorySelect(d?.category_id || "");

    getStoredProductImageIds(d).forEach(id=>{
        productImageItems.push({
            key:"old-"+id,
            id,
            file:null,
            url:fileUrl(id),
            isNew:false
        });
    });

    renderProductImageGrid();
    $("#productModal").classList.add("open");
}

function closeProductModal(){
    $("#productModal").classList.remove("open");
    editingProduct=null;
    $("#productForm").reset();
    $("#productSort").value=nextSort(products);

    revokeNewImageUrls();
    productImageItems=[];
    removedProductImageIds=new Set();

    if(productImageSortable){
        productImageSortable.destroy();
        productImageSortable=null;
    }

    $("#productImageGrid").innerHTML="";
}

window.editProduct=async id=>{
    try{
        await loadCategories();
        const d=await db.getDocument(DATABASE_ID,PRODUCT_TABLE_ID,id);
        openProductModal(d);
    }catch(e){ say($("#productNotice"),"讀取商品失敗："+e.message,"err"); }
};

window.removeProduct=async id=>{
    if(!confirm("確定要刪除這個商品嗎？")) return;

    try{
        const d=await db.getDocument(DATABASE_ID,PRODUCT_TABLE_ID,id);
        const imageIds=getStoredProductImageIds(d);

        await db.deleteDocument(DATABASE_ID,PRODUCT_TABLE_ID,id);

        for(const imageId of imageIds){
            await deleteImage(imageId);
        }

        await normalizeTable(PRODUCT_TABLE_ID);
        say($("#productNotice"),"商品已刪除");
        await loadProducts();
    }catch(e){ say($("#productNotice"),"刪除失敗："+e.message,"err"); }
};

$("#productImage").onchange=()=>{
    const input=$("#productImage");
    if(!input.files?.length) return;

    addSelectedProductImages(input.files);

    /* 允許下一次再次選擇同一個檔案 */
    input.value="";
};

$("#productImageGrid").addEventListener("click",e=>{
    const button=e.target.closest(".product-image-remove");
    if(!button) return;

    const key=button.dataset.key;
    const item=productImageItems.find(image=>image.key===key);
    if(!item) return;

    if(item.isNew && item.url){
        URL.revokeObjectURL(item.url);
    }

    if(!item.isNew && item.id){
        removedProductImageIds.add(item.id);
    }

    productImageItems=productImageItems.filter(image=>image.key!==key);
    renderProductImageGrid();
});

$("#productForm").onsubmit=async e=>{
    e.preventDefault();

    const name=$("#productName").value.trim();
    const categoryId=$("#productCategory").value;
    const sort=Number($("#productSort").value);
    const productInfo=$("#productInfo").value.trim();

    if(!name) return say($("#productNotice"),"請輸入商品名稱","err");
    if(!categoryId) return say($("#productNotice"),"請選擇商品分類","err");

    const btn=$("#productSave");
    btn.disabled=true;
    btn.textContent="儲存中...";

    const uploadedThisSave=[];

    try{
        const finalImageIds=[];

        /* 依照目前拖曳後的順序逐張處理 */
        for(const item of productImageItems){
            if(item.isNew){
                const newId=await uploadImage(item.file);
                uploadedThisSave.push(newId);
                finalImageIds.push(newId);
            }else if(item.id){
                finalImageIds.push(item.id);
            }
        }

        const imageId=finalImageIds[0] || "";

        const data={
            name:name,
            category_id:categoryId,
            image_id:imageId,
            image_ids:finalImageIds,
            sort_order:sort,
            product_info:productInfo
        };

        if(editingProduct){
            await db.updateDocument(
                DATABASE_ID,
                PRODUCT_TABLE_ID,
                editingProduct.$id,
                data
            );

            await placeAt(PRODUCT_TABLE_ID,editingProduct.$id,sort);

            /* 資料儲存成功後，才真的刪除使用者按 × 移除的舊圖片 */
            for(const removedId of removedProductImageIds){
                if(!finalImageIds.includes(removedId)){
                    await deleteImage(removedId);
                }
            }

            say($("#productNotice"),"商品已更新");
        }else{
            const created=await db.createDocument(
                DATABASE_ID,
                PRODUCT_TABLE_ID,
                Appwrite.ID.unique(),
                data,
                [
                    Appwrite.Permission.read(Appwrite.Role.any()),
                    Appwrite.Permission.update(Appwrite.Role.team(ADMIN_TEAM_ID)),
                    Appwrite.Permission.delete(Appwrite.Role.team(ADMIN_TEAM_ID))
                ]
            );

            await placeAt(PRODUCT_TABLE_ID,created.$id,sort);
            say($("#productNotice"),"商品已新增");
        }

        closeProductModal();
        await loadProducts();

    }catch(e){
        console.error(e);

        /* 若資料儲存失敗，只清掉這次剛上傳的新圖片 */
        for(const uploadedId of uploadedThisSave){
            await deleteImage(uploadedId);
        }

        say($("#productNotice"),"儲存失敗："+e.message,"err");

    }finally{
        btn.disabled=false;
        btn.textContent="儲存商品";
    }
};

/* 商品搜尋 / 分類篩選 */
$("#productSearch").addEventListener("input",e=>{
    productSearchKeyword=e.target.value || "";
    renderProductList();
});

$("#productCategoryFilter").addEventListener("change",e=>{
    productCategoryFilter=e.target.value || "all";
    renderProductList();
});

/* 按鈕 */
$("#addCategory").onclick=async()=>{
    try{
        await loadCategories();
        openCategoryModal(null,"parent","");
    }catch(e){
        say($("#categoryNotice"),"分類讀取失敗："+e.message,"err");
    }
};
$("#categoryCancel").onclick=closeCategoryModal;
$("#categoryModal").onclick=e=>{if(e.target===$("#categoryModal")) closeCategoryModal()};

$("#addProduct").onclick=async()=>{
    try{
        await loadCategories();
        await loadProducts();
        if(!categories.length){
            say($("#productNotice"),"請先新增至少一個商品分類","err");
            return;
        }
        openProductModal();
    }catch(e){
        say($("#productNotice"),"分類讀取失敗："+e.message,"err");
    }
};
$("#productCancel").onclick=closeProductModal;
$("#productModal").onclick=e=>{if(e.target===$("#productModal")) closeProductModal()};

/* 登出 */
$("#logout").onclick=async()=>{
    try{ await account.deleteSession("current"); }
    catch(e){ console.warn(e); }
    finally{ location.replace("index.html"); }
};

/* 啟動 */
(async()=>{
    await guard();
    await loadCategories();

    /* 預先讀取商品資料，分類刪除時可檢查是否仍有商品使用 */
    try{
        const result=await db.listDocuments(
            DATABASE_ID,
            PRODUCT_TABLE_ID,
            [Appwrite.Query.orderAsc("sort_order"),Appwrite.Query.limit(100)]
        );
        products=result.documents;
    }catch(e){
        console.warn("預讀商品失敗",e);
    }
})();
</script>
</body>
